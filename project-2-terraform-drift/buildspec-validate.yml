
version: 0.2

env:
  variables:
    TF_VERSION: "1.6.6"
    TF_STATE_BUCKET: "enminto-p2-tfstate-580069881307"
    TF_LOCK_TABLE: "enminto-p2-terraform-lock"

phases:
  install:
    commands:
      - echo "Installing Terraform..."
      - curl -fsSLo /tmp/terraform.zip https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip
      - unzip -o /tmp/terraform.zip -d /tmp
      - install /tmp/terraform /usr/local/bin/terraform
      - terraform version

  pre_build:
    commands:
      - echo "Validating Terraform formatting..."
      - terraform -chdir=project-2-terraform-drift/terraform fmt -check -recursive
      - echo "Initializing Terraform backend..."
      - terraform -chdir=project-2-terraform-drift/terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=project-2/terraform.tfstate" -backend-config="region=ap-south-1" -backend-config="encrypt=true" -backend-config="dynamodb_table=${TF_LOCK_TABLE}"

  build:
    commands:
      - echo "Validating Terraform configuration..."
      - terraform -chdir=project-2-terraform-drift/terraform validate
      - echo "Generating Terraform execution plan..."
      - terraform -chdir=project-2-terraform-drift/terraform plan -input=false -no-color -lock-timeout=5m

  post_build:
    commands:
      - |
        if [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ]; then
          echo "Terraform validation pipeline completed successfully."
        else
          echo "Terraform validation pipeline failed. Check the build logs."
        fi
